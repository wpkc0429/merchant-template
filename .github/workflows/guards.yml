# Guards for the merchant template and every merchant repo made from it. Pure Node, no dependencies, no secrets.
#
#   * Always:  storefront layer guard (+ hash manifest, strict CSP in public/_headers), content schema lint (offline),
#              admin design guard (+ strict CSP in admin/deploy/) + its self-test.
#   * NEVER:   registering the content schema on the platform (human only: no credentials in CI, no call to the registration endpoint).
#   * On `design/storefront-*` branches: scripts/check-scope.mjs storefront (only the storefront design paths may change).
#   * On `design/admin-*` branches:      scripts/check-scope.mjs admin (only admin/design/** may change).
#   * On ANY `design/*` branch:          scripts/check-locked.mjs fails the run if a locked path, config.js, a hash
#                                        manifest or template.json is modified.
#
# IMPORTANT, HUMAN STEP ON GITHUB (a workflow file cannot configure this itself):
#   Configure branch protection for the deploying branch (main). Settings -> Branches (or Rulesets) -> require a pull request before
#   merging, require the "guards" status check, and block direct pushes (also for admins if you can). Without
#   it, nothing stops a direct push to main, which auto-deploys the storefront. Because a pull request can edit
#   this very workflow, also require review from a human code owner for `.github/**` and the locked paths.
name: guards

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Work out the base commit and the branch kind
        id: ctx
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "${HEAD_REF#design/}" != "$HEAD_REF" ]; then
            # a push to a design branch: everything the branch changed since it left the default branch
            git fetch --no-tags origin "$DEFAULT_BRANCH" || true
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ]; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          kind=other
          case "$HEAD_REF" in
            design/storefront-*) kind=storefront ;;
            design/admin-*) kind=admin ;;
            design/*) kind=design ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "branch=$HEAD_REF base=$base kind=$kind"

      - name: Storefront guard (layers + hash manifest)
        run: node scripts/check-layers.mjs --check

      - name: Content schema lint (offline; the platform registration is a HUMAN step and is never run here)
        run: node scripts/check-content-schema.mjs --lint

      - name: Admin guard (design layer, ctx, core manifest)
        run: |
          if [ "${{ steps.ctx.outputs.kind }}" = "admin" ]; then
            node admin/scripts/check-design.mjs --base "${{ steps.ctx.outputs.base }}"
          else
            # --base would reject legitimate non-admin changes as "out of scope"; the scope rule is enforced per design/* branch.
            node admin/scripts/check-design.mjs
          fi

      - name: Admin guard self-test
        run: node admin/scripts/test-guard.mjs

      - name: Scope check (design/storefront-* or design/admin-* branches)
        if: steps.ctx.outputs.kind == 'storefront' || steps.ctx.outputs.kind == 'admin'
        run: node scripts/check-scope.mjs "${{ steps.ctx.outputs.kind }}" --base "${{ steps.ctx.outputs.base }}"

      - name: A design/* branch must not modify locked paths
        if: steps.ctx.outputs.kind != 'other'
        run: node scripts/check-locked.mjs --base "${{ steps.ctx.outputs.base }}" --head HEAD

  # Template repo only: the tests for new-merchant / sync-core / import-catalog live in tests/, which is a
  # template-only path and does not exist in merchant repos (the job then does nothing).
  template-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Run the template tests (skipped in merchant repos)
        run: |
          if [ -f tests/run.mjs ]; then
            git config --global user.name ci
            git config --global user.email ci@localhost
            node tests/run.mjs
          else
            echo "no tests/run.mjs: merchant repo, nothing to do"
          fi

  # Real-browser suites (Playwright + Chromium) that need ONLY this repository: stub / fake platform API + static servers (decision D22).
  # REQUIRE_BROWSER_TESTS=1 turns a missing browser into a failure (no silent skip) and tests/e2e/ci-browser.mjs asserts that
  # executed checks > 0. The suites that need the ecommerce stack (private repo) are NOT run here and no secret is used.
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_VERSION: 1.65.1
      REQUIRE_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Template repo only (tests/ does not exist in merchant repos; the job then does nothing)
        id: present
        run: |
          if [ -f tests/e2e/ci-browser.mjs ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "no tests/e2e/ci-browser.mjs: merchant repo, nothing to do"; fi

      - name: Install the pinned Playwright outside the repository (the template has no npm dependencies)
        if: steps.present.outputs.yes == 'true'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --save-exact --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"

      - name: Cache the Chromium download
        if: steps.present.outputs.yes == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Chromium and its system libraries
        if: steps.present.outputs.yes == 'true'
        run: |
          cd "$PLAYWRIGHT_DIR"
          npx playwright install --with-deps chromium

      - name: Run the real-browser suites (a skip or zero executed checks fails the job)
        if: steps.present.outputs.yes == 'true'
        env:
          E2E_OUT: ${{ github.workspace }}/admin/e2e/out/content-storefront
        run: node tests/e2e/ci-browser.mjs

      - name: Upload screenshots (failure only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-screenshots
          path: admin/e2e/out/
          if-no-files-found: ignore
          retention-days: 7
